[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-analysis-api"
version = "2.0.0"
description = "Evidence-backed resume analysis and role matching API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5.0,<7",
  "python-docx>=1.1,<2",
  "PyYAML>=6.0,<7",
  "numpy>=1.26,<3",
  "fastembed>=0.4,<1",
  "fsspec>=2026.6.0",
  "openai>=1.60,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "httpx>=0.27,<1",
  "reportlab>=4.2,<6",
  "ruff>=0.7,<1",
  "mypy>=1.11,<3",
  "pip-audit>=2.7,<3",
]
eval = [
  "sentence-transformers>=3.0,<7",
  "scikit-learn>=1.4,<2",
  "torch>=2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["BLE001", "TRY401", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
