name: Deploy API to Oracle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/oracle/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: oracle-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check deployment secrets
        id: config
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          if [ -n "$ORACLE_HOST" ] && [ -n "$ORACLE_USER" ] && [ -n "$ORACLE_SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Oracle deploy secrets are not configured; skipping deployment."
          fi

      - name: Deploy over SSH
        if: steps.config.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/resumeanalysis
            ./deploy/oracle/deploy.sh
