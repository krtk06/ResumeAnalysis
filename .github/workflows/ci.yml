name: CI

on:
  push:
    branches: [main, "ft/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen --extra dev
      - name: Ruff
        run: |
          uv run ruff check app tests
          uv run ruff format --check app tests
      - name: Mypy
        run: uv run mypy app
      - name: Pytest
        run: uv run pytest --cov=app --cov-report=term-missing
      - name: Audit production dependencies
        run: uv run pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build API image without the model preload
        run: docker build -t resume-analysis-api:ci --build-arg PRELOAD_MODEL=0 backend
      - name: Smoke test container
        run: |
          docker run -d --name resume-api-ci -p 8000:8000 \
            -e EMBEDDER_BACKEND=hash \
            -e LLM_ENABLED=false \
            -e RATE_LIMIT_PER_HOUR=100 \
            -e RATE_LIMIT_PER_DAY=100 \
            resume-analysis-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health/ready; then exit 0; fi
            sleep 2
          done
          docker logs resume-api-ci
          exit 1
